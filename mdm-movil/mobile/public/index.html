<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0906">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

</head>
<body>
  <header class="top">
    <div class="brand"><img src="img/icon-192.png" alt=""><div><b>MDM</b><small>Centro de control</small></div></div>
    <div class="top-r">
      <button class="zen-btn" id="zenBtn" aria-label="Antiestrés" title="Antiestrés"><i class="zen-orb"><svg viewBox="0 0 48 32" aria-hidden="true"><path class="pad" d="M14 4h20c5 0 8 3 10 9l3 10c1 4-1 7-4 7-2 0-4-1-6-4l-2-3H13l-2 3c-2 3-4 4-6 4-3 0-5-3-4-7l3-10c2-6 5-9 10-9z"/><path class="ln" d="M11 11v6M8 14h6"/><circle class="fb" cx="37" cy="10.5" r="1.6"/><circle class="fb" cx="40.5" cy="14" r="1.6"/><circle class="fb" cx="33.5" cy="14" r="1.6"/><circle class="fb" cx="37" cy="17.5" r="1.6"/><circle class="st" cx="18" cy="21" r="3"/><circle class="st" cx="30" cy="21" r="3"/></svg></i></button>
      <span id="conn" class="pill"><i></i><span>Conectando…</span></span>
    </div>
  </header>
  <div id="mkt" class="mkt"></div>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-v="accounts" class="on"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Cuentas</span></button>
    <button data-v="pnl"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2.5v3M16 2.5v3"/><path d="M7 13h3v3H7zM14 13h3v3h-3z"/></svg><span>P&amp;L</span></button>
    <button data-v="copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>Copiador</span></button>
    <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Noticias</span></button>
    <button data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden><div class="sheet-bg"></div><div class="sheet-box" id="sheetBox"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
  <script src="zen.js"></script>
</body>
</html>
