  font-weight:300;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

a{ color:inherit; text-decoration:none }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left }
:focus-visible{ outline:1px solid var(--oro); outline-offset:-3px }

.app{
  display:grid;
  grid-template-columns:clamp(362px, 38vw, 574px) 1fr;
  height:100dvh;
}

/* ── Columna izquierda ────────────────────────────────── */

.lateral{
  display:flex;
  flex-direction:column;
  background:var(--lateral);
  border-right:1px solid var(--borde);
  min-height:0;
}

.marca-zona{
  position:relative;
  padding:44px 30px 34px;
  border-bottom:1px solid var(--borde);
  text-align:center;
  overflow:hidden;
  flex:none;
}

.marca-zona::before{
  content:'';
  position:absolute;
  left:50%; top:34%;
  width:330px; height:330px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(201,162,39,.17), transparent 66%);
  pointer-events:none;
}

.marca{
  position:relative;
  z-index:1;
  display:inline-block;
  font-family:'Cormorant Garamond', Georgia, serif;
  font-weight:700;
  font-size:66px;
  line-height:.9;
  letter-spacing:.09em;
  background:linear-gradient(101deg,
      #8C6A14 0%,   #B8921F 14%,  var(--oro) 27%,
      #EFDC9B 38%,  #FFFBEC 45%,  #EFDC9B 52%,
      var(--oro) 64%, #A98617 80%, #7E5F11 100%);
  background-size:270% 100%;
  background-position:118% 0;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 1px 0 rgba(0,0,0,.5);
  animation:asentar 1700ms cubic-bezier(.16,.85,.28,1) both,
            destello 8s 1500ms ease-in-out infinite,
            aureolar 8s 1500ms ease-in-out infinite;
}

/* El texto entra abriéndose y se asienta en su interletraje final */
@keyframes asentar{
  from{ opacity:0; letter-spacing:.34em }
  to  { opacity:1; letter-spacing:.09em }
}

/* Haz vertical detrás del logotipo, como el de la torre en tus portadas */
.marca-zona::after{
  content:'';
  position:absolute;
  left:50%; top:0;
  z-index:0;
  width:1px; height:56%;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
      transparent, rgba(230,207,146,.42) 58%, rgba(230,207,146,.05) 88%, transparent);
  opacity:0;
  pointer-events:none;
  animation:haz 8s 1500ms ease-in-out infinite;
}

@keyframes haz{
  0%, 6%    { opacity:0 }
  20%       { opacity:1 }
  44%, 100% { opacity:0 }
}
}

@keyframes aureolar{
  0%, 6%, 100%{
    filter:drop-shadow(0 0 18px rgba(201,162,39,.42))
           drop-shadow(0 0 54px rgba(201,162,39,.18));
  }
  24%{
    filter:drop-shadow(0 0 26px rgba(201,162,39,.72))
           drop-shadow(0 0 78px rgba(201,162,39,.34));
  }
  48%{
    filter:drop-shadow(0 0 18px rgba(201,162,39,.42))
           drop-shadow(0 0 54px rgba(201,162,39,.18));
  }
}

/* Halo detrás del logotipo, respira al mismo ritmo que el destello */
.marca-zona::before{ animation:respirar 8s 1500ms ease-in-out infinite }

@keyframes destello{
  0%,  6%  { background-position:118% 0 }
  34%      { background-position:-34% 0 }
  100%     { background-position:-34% 0 }
}

@keyframes respirar{
  0%, 6%, 100%{ opacity:.72 }
  22%         { opacity:1 }
  46%         { opacity:.72 }
}

.lema{
  position:relative;
  z-index:1;
  margin-top:13px;
  font-size:8.5px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--bronce);
  line-height:1.7;
  animation:encender 1300ms 220ms cubic-bezier(.16,.8,.3,1) both;
}

@keyframes encender{
  from{ opacity:0; transform:translateY(10px) }
  to  { opacity:1; transform:translateY(0) }
}

.epigrafe{
  flex:none;
  padding:24px 30px 12px;
  font-size:9.5px;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:#5F5849;
}

.navegacion{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:0 18px 18px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.item{
  position:relative;
  display:grid;
  grid-template-columns:clamp(112px, 14.5vw, 208px) 1fr;
  align-items:center;
  gap:clamp(14px, 1.6vw, 22px);
  width:100%;
  padding:14px 16px;
  border-radius:2px;
  transition:background .22s;
}

.item::before{
  content:'';
  position:absolute;
  left:0; top:50%;
  width:2px; height:0;
  background:var(--oro);
  transform:translateY(-50%);
  transition:height .28s cubic-bezier(.2,.7,.3,1);
}

.item:hover{ background:rgba(201,162,39,.045) }

.item[aria-current="true"]{ background:rgba(201,162,39,.075) }
.item[aria-current="true"]::before{ height:64% }

.item .miniatura{
  width:100%;
  aspect-ratio:1;
  height:auto;
  object-fit:cover;
  border:1px solid var(--borde-vivo);
  filter:grayscale(.55) brightness(.72);
  transition:filter .28s, border-color .28s;
}

.item:hover .miniatura{ filter:grayscale(.2) brightness(.9) }

.item[aria-current="true"] .miniatura{
  filter:none;
  border-color:var(--oro);
}

.item .nombre{
  display:block;
  font-family:'Cormorant Garamond', Georgia, serif;
  font-variant:small-caps;
  font-weight:500;
  font-size:clamp(19px, 1.9vw, 26px);
  line-height:1.15;
  letter-spacing:.075em;
  color:var(--tenue);
  transition:color .22s;
}

.item:hover .nombre{ color:var(--crema) }
.item[aria-current="true"] .nombre{ color:var(--oro-claro) }

.item .cuenta{
  display:block;
  margin-top:5px;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:#655E4F;
}

.nota{
  flex:none;
  padding:16px 30px 22px;
  border-top:1px solid var(--borde);
  font-size:10px;
  letter-spacing:.05em;
  color:#4F4A3F;
}

/* ── Columna derecha ──────────────────────────────────── */

.contenido{
  min-height:0;
  overflow-y:auto;
  padding:clamp(42px, 6vw, 76px) clamp(28px, 5.5vw, 78px) 60px;
}

.cabecera-mod{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:28px;
  padding-bottom:22px;
  border-bottom:1px solid var(--borde-vivo);
}

.cabecera-mod h1{
  font-family:'Cormorant Garamond', Georgia, serif;
  font-variant:small-caps;
  font-weight:500;
  font-size:clamp(34px, 4vw, 52px);
  line-height:1.05;
  letter-spacing:.045em;
  background:linear-gradient(176deg, #F7EAC2 6%, var(--oro) 62%, #96731A 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.cabecera-mod .resumen{
  margin-top:7px;
  max-width:52ch;
  font-size:15px;
  color:var(--tenue);
}

.total{
  flex:none;
  font-size:10px;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--bronce);
  padding-bottom:6px;
}

.lista{ margin-top:6px }

.clase{
  display:grid;
  grid-template-columns:38px 1fr auto;
  align-items:baseline;
  gap:18px;
  padding:20px 8px 21px 4px;
  border-bottom:1px solid var(--borde);
  transition:padding-left .26s cubic-bezier(.2,.7,.3,1), border-color .26s;
}

.clase:hover,
.clase:focus-visible{ padding-left:18px; border-color:var(--borde-vivo) }

.clase .indice{
  font-size:12px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.1em;
  color:#5C5648;
  transition:color .26s;
}

.clase:hover .indice{ color:var(--oro) }

.clase .titulo{
  font-family:'Cormorant Garamond', Georgia, serif;
  font-variant:small-caps;
  font-weight:500;
  font-size:23px;
  line-height:1.2;
  letter-spacing:.055em;
  color:var(--crema);
  transition:color .26s;
}

.clase:hover .titulo,
.clase:focus-visible .titulo{ color:var(--oro-claro) }

.clase .fecha{
  margin-top:3px;
  font-size:10px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#6B6455;
}

.clase .duracion{
  font-size:12.5px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
  color:var(--tenue);
  white-space:nowrap;
}

.entrada{ animation:entrar 400ms cubic-bezier(.16,.8,.3,1) both }

@keyframes entrar{
  from{ opacity:0; transform:translateY(9px) }
  to  { opacity:1; transform:translateY(0) }
}

/* ── Panel de edición ─────────────────────────────────── */

.engranaje{
  display:none;
  position:absolute;
  right:18px; bottom:16px;
  width:34px; height:34px;
  display:grid; place-items:center;
  border:1px solid var(--borde);
  border-radius:50%;
  color:#5F5849;
  transition:color .22s, border-color .22s, transform .5s;
}
.engranaje.disponible{ display:grid }
.engranaje:hover{ color:var(--oro); border-color:var(--bronce); transform:rotate(60deg) }
.engranaje svg{ width:16px; height:16px }

.velo{
  position:fixed; inset:0;
  z-index:50;
  background:rgba(5,5,4,.82);
  backdrop-filter:blur(3px);
  display:none;
}
.velo.visible{ display:block }

.editor{
  position:absolute;
  top:0; right:0; bottom:0;
  width:min(660px, 100%);
  background:var(--lateral);
  border-left:1px solid var(--borde-vivo);
  display:flex; flex-direction:column;
  animation:entrar-editor 380ms cubic-bezier(.16,.8,.3,1) both;
}

@keyframes entrar-editor{
  from{ transform:translateX(34px); opacity:0 }
  to  { transform:translateX(0); opacity:1 }
}

.editor-cab{
  flex:none;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 26px;
  border-bottom:1px solid var(--borde);
}
.editor-cab h2{
  font-family:'Cormorant Garamond', Georgia, serif;
  font-variant:small-caps;
  font-weight:500; font-size:25px; letter-spacing:.06em;
  color:var(--oro-claro);
}
.cerrar{ font-size:24px; line-height:1; color:var(--tenue); padding:4px 8px }
.cerrar:hover{ color:var(--crema) }

.editor-cuerpo{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:20px 26px 30px }

.aviso-editor{
  margin-bottom:20px;
  padding:12px 14px;
  border:1px solid var(--borde-vivo);
  font-size:12.5px;
  line-height:1.55;
  color:var(--tenue);
}

.bloque{
  margin-bottom:16px;
  border:1px solid var(--borde);
}
.bloque-cab{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px;
  background:rgba(201,162,39,.035);
  border-bottom:1px solid var(--borde);
}
.bloque-cab img{ width:40px; height:40px; object-fit:cover; border:1px solid var(--borde-vivo); flex:none }
.bloque-cab .tit{
  flex:1 1 auto;
  font-family:'Cormorant Garamond', Georgia, serif;
  font-variant:small-caps; font-weight:500; font-size:19px;
  letter-spacing:.07em; color:var(--oro-claro);
}
.bloque-cuerpo{ padding:14px }

.campo{ display:block; margin-bottom:10px }
.campo span{
  display:block; margin-bottom:4px;
  font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; color:#655E4F;
}
.campo input{
  width:100%;
  padding:8px 10px;
  background:#0A0908;
  border:1px solid var(--borde);
  color:var(--crema);
  font:300 14px 'Jost', sans-serif;
}
.campo input:focus{ outline:none; border-color:var(--bronce) }

.fila{
  padding:12px;
  margin-bottom:10px;
  border:1px solid var(--borde);
  background:rgba(255,255,255,.012);
}
.fila-cab{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px;
  font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#655E4F;
}
.duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px }

.boton{
  padding:8px 16px;
  border:1px solid var(--borde-vivo);
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--tenue);
  transition:border-color .2s, color .2s;
}
.boton:hover{ border-color:var(--oro); color:var(--oro-claro) }
.boton.leve{ border-color:transparent; color:#5F5849; padding:4px 8px; letter-spacing:.14em }
.boton.leve:hover{ color:#C46A4A }

.editor-pie{
  flex:none;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:18px 26px;
  border-top:1px solid var(--borde);
}
.descargar{
  padding:12px 26px;
  border:1px solid var(--oro);
  background:rgba(201,162,39,.1);
  font-size:12.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--oro-claro);
  transition:background .2s;
}
.descargar:hover{ background:rgba(201,162,39,.2) }

.publicar{
  margin-top:22px;
  border:1px solid var(--borde-vivo);
  padding:16px;
}
.publicar h3{
  font-family:'Cormorant Garamond', Georgia, serif;
  font-variant:small-caps; font-weight:500; font-size:20px;
  letter-spacing:.07em; color:var(--oro-claro);
  margin-bottom:4px;
}
.publicar .expl{ font-size:12.5px; line-height:1.55; color:var(--tenue); margin-bottom:14px }
.estado{
  margin-top:12px; padding:10px 12px;
  font-size:12.5px; line-height:1.5;
  border:1px solid var(--borde);
  color:var(--tenue);
  display:none;
}
.estado.visible{ display:block }
.estado.bien{ border-color:#3F6B3A; color:#9FD196 }
.estado.mal{ border-color:#7A3B2E; color:#E0A292 }

/* ── Móvil ────────────────────────────────────────────── */

@media (max-width:900px){
  body{ overflow:auto }
  .app{ grid-template-columns:1fr; height:auto }
  .lateral{ border-right:none; border-bottom:1px solid var(--borde) }
  .marca{ font-size:52px }
  .navegacion{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 16px 18px;
    scrollbar-width:none;
  }
  .navegacion::-webkit-scrollbar{ display:none }
  .item{
    flex:0 0 auto;
    display:block;
    width:152px;
    padding:8px;
  }
  .item::before{ display:none }
  .item .miniatura{ width:100%; height:auto; aspect-ratio:1 }
  .item .nombre{ font-size:15px; margin-top:8px; display:block }
  .item .cuenta{ font-size:8.5px }
  .contenido{ padding:36px 24px 56px }
  .cabecera-mod{ display:block }
  .total{ margin-top:12px }
  .clase{ grid-template-columns:28px 1fr auto; gap:12px }
  .clase .titulo{ font-size:20px }
}

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important }
}
</style>
</head>
<body>

<div class="app">

  <aside class="lateral">
    <div class="marca-zona">
      <div class="marca">MDM</div>
      <p class="lema">Método de dominancia<br>en mercados de futuros</p>
    </div>
    <p class="epigrafe">Módulos</p>
    <nav class="navegacion" id="navegacion"></nav>
    <p class="nota">Material de uso personal e intransferible.</p>
    <button class="engranaje" id="engranaje" type="button" title="Editar contenido" aria-label="Editar contenido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"></path>
      </svg>
    </button>
  </aside>

  <main class="contenido" id="contenido"></main>

</div>

<div class="velo" id="velo">
  <div class="editor">
    <div class="editor-cab">
      <h2>Editar contenido</h2>
      <button class="cerrar" id="cerrar" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="editor-cuerpo" id="editor-cuerpo"></div>
    <div class="editor-pie">
      <button class="boton" id="add-modulo" type="button">Añadir módulo</button>
      <div style="display:flex;gap:10px">
        <button class="boton" id="descargar" type="button">Descargar</button>
        <button class="descargar" id="publicar" type="button">Publicar en la web</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){

  /* Copia del archivo tal cual se cargó, antes de que pintemos nada.
     Sirve para poder regenerarlo al descargar. */
  const PLANTILLA = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  const nav   = document.getElementById('navegacion');
  const zona  = document.getElementById('contenido');
  const velo  = document.getElementById('velo');
  const cuerpo= document.getElementById('editor-cuerpo');
  let activo = 0;

  const limpiar = t => String(t).replace(/[<>&"]/g, c =>
    ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

  /* ── Pintado ─────────────────────────────────────────── */

  function pintarNav(){
    nav.innerHTML = '';
    CURSO.modulos.forEach(function(mod, i){
      const n = mod.clases.length;
      const b = document.createElement('button');
      b.className = 'item';
      b.type = 'button';
      b.setAttribute('aria-current', i === activo ? 'true' : 'false');
      b.innerHTML =
        '<img class="miniatura" src="' + limpiar(mod.portada) + '" alt="">' +
        '<span>' +
          '<span class="nombre">' + limpiar(mod.nombre) + '</span>' +
          '<span class="cuenta">' + n + (n === 1 ? ' clase' : ' clases') + '</span>' +
        '</span>';
      b.addEventListener('click', function(){ abrir(i); });
      nav.appendChild(b);
    });
  }

  function abrir(i){
    activo = Math.max(0, Math.min(i, CURSO.modulos.length - 1));
    nav.querySelectorAll('.item').forEach(function(x, j){
      x.setAttribute('aria-current', j === activo ? 'true' : 'false');
    });

    const mod = CURSO.modulos[activo];
    if (!mod){ zona.innerHTML = ''; return; }
    const n = mod.clases.length;

    zona.innerHTML =
      '<div class="entrada">' +
        '<header class="cabecera-mod">' +
          '<div>' +
            '<h1>' + limpiar(mod.nombre) + '</h1>' +
            (mod.resumen ? '<p class="resumen">' + limpiar(mod.resumen) + '</p>' : '') +
          '</div>' +
          '<div class="total">' + n + (n === 1 ? ' clase' : ' clases') + '</div>' +
        '</header>' +
        '<div class="lista">' +
          mod.clases.map(function(c, k){
            return '<a class="clase" href="' + limpiar(c.enlace) + '" target="_blank" rel="noopener">' +
              '<span class="indice">' + String(k + 1).padStart(2, '0') + '</span>' +
              '<span>' +
                '<span class="titulo">' + limpiar(c.titulo) + '</span>' +
                (c.fecha ? '<span class="fecha" style="display:block">' + limpiar(c.fecha) + '</span>' : '') +
              '</span>' +
              '<span class="duracion">' + limpiar(c.duracion || '') + '</span>' +
            '</a>';
          }).join('') +
        '</div>' +
      '</div>';

    zona.scrollTop = 0;
  }

  function repintar(){ pintarNav(); abrir(activo); }

  /* ── Panel de edición ────────────────────────────────── */

  function campo(etiqueta, valor, alCambiar){
    const l = document.createElement('label');
    l.className = 'campo';
    l.innerHTML = '<span>' + limpiar(etiqueta) + '</span>';
    const i = document.createElement('input');
    i.type = 'text';
    i.value = valor || '';
    i.addEventListener('input', function(){ alCambiar(i.value); });
    l.appendChild(i);
    return l;
  }

  function pintarEditor(){
    cuerpo.innerHTML = '';

    const aviso = document.createElement('p');
    aviso.className = 'aviso-editor';
    aviso.textContent = 'Los cambios se ven al momento pero no se guardan solos. ' +
      'Cuando termines, pulsa Publicar en la web (abajo del todo) y quedan en línea ' +
      'en un minuto. Si cierras sin publicar, se pierden.';
    cuerpo.appendChild(aviso);

    CURSO.modulos.forEach(function(mod, i){

      const bloque = document.createElement('div');
      bloque.className = 'bloque';

      /* Cabecera del módulo */
      const cab = document.createElement('div');
      cab.className = 'bloque-cab';

      const mini = document.createElement('img');
      mini.src = mod.portada || '';
      cab.appendChild(mini);

      const tit = document.createElement('span');
      tit.className = 'tit';
      tit.textContent = mod.nombre;
      cab.appendChild(tit);

      const subir = document.createElement('button');
      subir.className = 'boton leve';
      subir.type = 'button';
      subir.textContent = '↑';
      subir.title = 'Subir';
      subir.addEventListener('click', function(){
        if (i === 0) return;
        const t = CURSO.modulos[i - 1];
        CURSO.modulos[i - 1] = CURSO.modulos[i];
        CURSO.modulos[i] = t;
        pintarEditor(); repintar();
      });
      cab.appendChild(subir);

      const bajar = document.createElement('button');
      bajar.className = 'boton leve';
      bajar.type = 'button';
      bajar.textContent = '↓';
      bajar.title = 'Bajar';
      bajar.addEventListener('click', function(){
        if (i === CURSO.modulos.length - 1) return;
        const t = CURSO.modulos[i + 1];
        CURSO.modulos[i + 1] = CURSO.modulos[i];
        CURSO.modulos[i] = t;
        pintarEditor(); repintar();
      });
      cab.appendChild(bajar);

      const borrarMod = document.createElement('button');
      borrarMod.className = 'boton leve';
      borrarMod.type = 'button';
      borrarMod.textContent = 'Borrar';
      borrarMod.addEventListener('click', function(){
        if (!confirm('¿Borrar el módulo "' + mod.nombre + '" y todas sus clases?')) return;
        CURSO.modulos.splice(i, 1);
        activo = 0;
        pintarEditor(); repintar();
      });
      cab.appendChild(borrarMod);

      bloque.appendChild(cab);

      /* Cuerpo del módulo */
      const cu = document.createElement('div');
      cu.className = 'bloque-cuerpo';

      cu.appendChild(campo('Nombre del módulo', mod.nombre, function(v){
        mod.nombre = v; tit.textContent = v; repintar();
      }));
      cu.appendChild(campo('Descripción', mod.resumen, function(v){
        mod.resumen = v; repintar();
      }));

      /* Cambiar portada */
      const lp = document.createElement('label');
      lp.className = 'campo';
      lp.innerHTML = '<span>Portada (se reduce a 640 px automáticamente)</span>';
      const fi = document.createElement('input');
      fi.type = 'file';
      fi.accept = 'image/*';
      fi.addEventListener('change', function(){
        const file = fi.files && fi.files[0];
        if (!file) return;
        const lector = new FileReader();
        lector.onload = function(e){
          const img = new Image();
          img.onload = function(){
            const c = document.createElement('canvas');
            c.width = 640; c.height = 640;
            const g = c.getContext('2d');
            const lado = Math.min(img.width, img.height);
            g.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2,
                        lado, lado, 0, 0, 640, 640);
            mod.portada = c.toDataURL('image/jpeg', 0.82);
            mini.src = mod.portada;
            repintar();
          };
          img.src = e.target.result;
        };
        lector.readAsDataURL(file);
      });
      lp.appendChild(fi);
      cu.appendChild(lp);

      /* Clases */
      mod.clases.forEach(function(c, k){
        const fila = document.createElement('div');
        fila.className = 'fila';

        const fc = document.createElement('div');
        fc.className = 'fila-cab';
        fc.innerHTML = '<span>Clase ' + String(k + 1).padStart(2, '0') + '</span>';
        const del = document.createElement('button');
        del.className = 'boton leve';
        del.type = 'button';
        del.textContent = 'Quitar';
        del.addEventListener('click', function(){
          mod.clases.splice(k, 1);
          pintarEditor(); repintar();
        });
        fc.appendChild(del);
        fila.appendChild(fc);

        fila.appendChild(campo('Título', c.titulo, function(v){ c.titulo = v; repintar(); }));
        fila.appendChild(campo('Enlace de Drive', c.enlace, function(v){ c.enlace = v; repintar(); }));

        const duo = document.createElement('div');
        duo.className = 'duo';
        duo.appendChild(campo('Duración', c.duracion, function(v){ c.duracion = v; repintar(); }));
        duo.appendChild(campo('Fecha', c.fecha, function(v){ c.fecha = v; repintar(); }));
        fila.appendChild(duo);

        cu.appendChild(fila);
      });

      const addClase = document.createElement('button');
      addClase.className = 'boton';
      addClase.type = 'button';
      addClase.textContent = 'Añadir clase';
      addClase.addEventListener('click', function(){
        mod.clases.push({ titulo:'Clase nueva', duracion:'', fecha:'', enlace:'' });
        activo = i;
        pintarEditor(); repintar();
      });
      cu.appendChild(addClase);

      bloque.appendChild(cu);
      cuerpo.appendChild(bloque);
    });

    pintarPublicacion();
  }

  /* ── Descarga del archivo actualizado ────────────────── */

  function descargar(){
    const datos = '/*DATOS_INICIO*/\nconst CURSO = ' +
                  JSON.stringify(CURSO, null, 2) + ';\n/*DATOS_FIN*/';
    const salida = PLANTILLA.replace(
      /\/\*DATOS_INICIO\*\/[\s\S]*?\/\*DATOS_FIN\*\//, datos);

    if (salida === PLANTILLA){
      alert('No se han podido escribir los datos. Avisa para revisarlo.');
      return;
    }

    const blob = new Blob([salida], { type:'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'mdm-clases.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  /* ── Conexiones ──────────────────────────────────────── */

  const boton = document.getElementById('engranaje');
  let autorizado = false;

  /* El engranaje no existe para el alumno: solo se muestra si la URL
     termina en #editar. Y aun así pide la clave. */
  function revisarAcceso(){
    if (location.hash === '#editar') boton.classList.add('disponible');
    else { boton.classList.remove('disponible'); velo.classList.remove('visible'); }
  }
  window.addEventListener('hashchange', revisarAcceso);
  revisarAcceso();

  boton.addEventListener('click', function(){
    if (!autorizado){
      const intento = prompt('Clave de edición');
      if (intento === null) return;
      if (intento !== CLAVE){ alert('Clave incorrecta.'); return; }
      autorizado = true;
    }
    pintarEditor();
    velo.classList.add('visible');
  });

  document.getElementById('cerrar').addEventListener('click', function(){
    velo.classList.remove('visible');
  });

  velo.addEventListener('click', function(e){
    if (e.target === velo) velo.classList.remove('visible');
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') velo.classList.remove('visible');
  });

  document.getElementById('add-modulo').addEventListener('click', function(){
    CURSO.modulos.push({
      nombre: 'Módulo nuevo',
      portada: '',
      resumen: '',
      clases: [{ titulo:'Clase nueva', duracion:'', fecha:'', enlace:'' }]
    });
    pintarEditor(); repintar();
  });

  document.getElementById('descargar').addEventListener('click', descargar);

  /* ── Publicación directa en GitHub ─────────────────────
     El token NO se guarda en el archivo: vive solo en este
     navegador. El HTML que ven los alumnos no lo contiene. */

  const AJUSTES = 'mdm_github';

  function leerAjustes(){
    try { return JSON.parse(localStorage.getItem(AJUSTES) || '{}'); }
    catch(e){ return {}; }
  }
  function guardarAjustes(a){
    try { localStorage.setItem(AJUSTES, JSON.stringify(a)); } catch(e){}
  }

  function pintarPublicacion(){
    const a = leerAjustes();
    const caja = document.createElement('div');
    caja.className = 'publicar';
    caja.innerHTML =
      '<h3>Publicar en la web</h3>' +
      '<p class="expl">Rellena esto una sola vez. Queda guardado en este navegador ' +
      'y no viaja dentro del archivo, así que los alumnos nunca lo ven.</p>';

    const campos = [
      ['repo',  'Usuario/repositorio',  a.repo  || '', 'tuusuario/tuusuario.github.io'],
      ['ruta',  'Ruta del archivo',      a.ruta  || 'mdm-clases.html', 'mdm-clases.html'],
      ['rama',  'Rama',                  a.rama  || 'main', 'main'],
      ['token', 'Token de GitHub',       a.token || '', 'github_pat_...']
    ];

    const refs = {};
    campos.forEach(function(c){
      const l = document.createElement('label');
      l.className = 'campo';
      l.innerHTML = '<span>' + c[1] + '</span>';
      const inp = document.createElement('input');
      inp.type = c[0] === 'token' ? 'password' : 'text';
      inp.value = c[2];
      inp.placeholder = c[3];
      inp.addEventListener('input', function(){
        const act = leerAjustes();
        act[c[0]] = inp.value.trim();
        guardarAjustes(act);
      });
      refs[c[0]] = inp;
      l.appendChild(inp);
      caja.appendChild(l);
    });

    const estado = document.createElement('div');
    estado.className = 'estado';
    estado.id = 'estado-pub';
    caja.appendChild(estado);

    cuerpo.appendChild(caja);
  }

  function avisar(texto, clase){
    const e = document.getElementById('estado-pub');
    if (!e) { alert(texto); return; }
    e.className = 'estado visible ' + (clase || '');
    e.textContent = texto;
  }

  /* Codifica a base64 respetando acentos y eñes */
  function aBase64(texto){
    const bytes = new TextEncoder().encode(texto);
    let bin = '';
    const paso = 0x8000;
    for (let i = 0; i < bytes.length; i += paso){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + paso));
    }
    return btoa(bin);
  }

  function construirSalida(){
    const datos = '/*DATOS_INICIO*/\n\n// Clave del panel de edición. Cámbiala por la que quieras.\n' +
      '// Para abrir el panel: añade #editar al final de la URL y recarga.\n' +
      'const CLAVE = ' + JSON.stringify(CLAVE) + ';\n\nconst CURSO = ' +
      JSON.stringify(CURSO, null, 2) + ';\n/*DATOS_FIN*/';
    return PLANTILLA.replace(/\/\*DATOS_INICIO\*\/[\s\S]*?\/\*DATOS_FIN\*\//, datos);
  }

  async function publicar(){
    const a = leerAjustes();
    if (!a.repo || !a.token){
      avisar('Faltan el repositorio o el token.', 'mal');
      return;
    }

    const repo  = a.repo.replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '');
    const ruta  = (a.ruta || 'mdm-clases.html').replace(/^\//, '');
    const rama  = a.rama || 'main';
    const base  = 'https://api.github.com/repos/' + repo;
    const cab   = {
      'Authorization': 'Bearer ' + a.token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };

    avisar('Publicando...');

    try {
      /* 1. Localizar la versión actual del archivo para obtener su sha */
      let sha = null;
      const r1 = await fetch(base + '/contents/' + encodeURI(ruta) + '?ref=' + encodeURIComponent(rama),
                             { headers: cab });
      if (r1.ok){
        sha = (await r1.json()).sha;
      } else if (r1.status === 403 || r1.status === 422){
        /* Archivo demasiado grande para ese endpoint: buscarlo en el árbol */
        const r2 = await fetch(base + '/git/trees/' + encodeURIComponent(rama) + '?recursive=1',
                               { headers: cab });
        if (r2.ok){
          const nodo = (await r2.json()).tree.find(function(x){ return x.path === ruta; });
          if (nodo) sha = nodo.sha;
        }
      } else if (r1.status === 401){
        avisar('El token no es válido o ha caducado.', 'mal');
        return;
      } else if (r1.status !== 404){
        avisar('No se pudo leer el repositorio (error ' + r1.status + ').', 'mal');
        return;
      }
      /* 404 significa que el archivo aún no existe: se creará */

      /* 2. Escribir la nueva versión */
      const cuerpoPeticion = {
        message: 'Actualizar clases · ' + new Date().toLocaleString('es-ES'),
        content: aBase64(construirSalida()),
        branch: rama
      };
      if (sha) cuerpoPeticion.sha = sha;

      const r3 = await fetch(base + '/contents/' + encodeURI(ruta), {
        method: 'PUT',
        headers: cab,
        body: JSON.stringify(cuerpoPeticion)
      });

      if (r3.ok){
        avisar('Publicado. GitHub Pages tarda un minuto en reflejarlo. ' +
               'Recarga la web pasado ese rato.', 'bien');
      } else {
        const err = await r3.json().catch(function(){ return {}; });
        avisar('GitHub rechazó el cambio (' + r3.status + '): ' +
               (err.message || 'sin detalle'), 'mal');
      }
    } catch(e){
      avisar('Fallo de red: ' + e.message, 'mal');
    }
  }

  document.getElementById('publicar').addEventListener('click', publicar);

  repintar();
})();
</script></body></html>
